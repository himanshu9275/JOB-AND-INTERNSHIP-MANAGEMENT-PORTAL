<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply - InternX</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <div class="logo-box">IX</div>
        <span>InternX</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="internships.html">Internships</a>
        <a href="applications.html">Applications</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html" class="nav-login">Login</a>
    </nav>

</header>


<main>

    <section class="page-header">

        <p class="tag">TAKE THE NEXT STEP</p>

        <h1>Application Form</h1>

        <p>
            Fill in your details to apply for a job or internship opportunity.
        </p>

    </section>


    <section class="application-section">

        <div class="application-card">

            <h2>Applicant Details</h2>

            <form>

                <div class="form-row">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Qualification</label>
                        <input
                            type="text"
                            placeholder="Enter your qualification"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label>Select Opportunity</label>

                    <select required>

                        <option value="">Select an opportunity</option>

                        <option>Software Developer - TechNova Solutions</option>

                        <option>Web Developer - Digital Works</option>

                        <option>Cyber Security Analyst - SecureNet India</option>

                        <option>Java Developer - CodeSphere Technologies</option>

                        <option>Web Development Intern - TechNova Solutions</option>

                        <option>Cyber Security Intern - SecureNet India</option>

                        <option>Data Analytics Intern - DataCore Pvt. Ltd.</option>

                        <option>Java Development Intern - CodeSphere Technologies</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Cover Letter</label>

                    <textarea
                        rows="6"
                        placeholder="Write a short cover letter..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Resume</label>

                    <input type="file">

                </div>


                <button type="submit" class="primary-btn application-btn">
                    Submit Application
                </button>

            </form>

        </div>

    </section>

</main>


<footer class="footer">

    <span>© 2026 InternX</span>

    <span>Job & Internship Management Portal</span>

</footer>

</body>
</html>
