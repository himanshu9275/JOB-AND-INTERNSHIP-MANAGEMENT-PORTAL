<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InternX</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <div class="logo-box">IX</div>
        <span>InternX</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="internships.html">Internships</a>
        <a href="applications.html">Applications</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="login.html" class="nav-login">Login</a>
    </nav>

</header>


<main class="login-page">

    <div class="login-card">

        <p class="tag">WELCOME TO INTERNX</p>

        <h1>Login</h1>

        <p class="login-text">
            Login to access jobs, internships and applications.
        </p>

        <form action="index.html">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >
            </div>


            <button type="submit" class="login-submit">
                Login
            </button>

        </form>

        <p class="demo-note">
            Frontend demo login
        </p>

    </div>

</main>


<footer class="footer">

    <span>© 2026 InternX</span>

    <span>Job & Internship Management Portal</span>

</footer>

</body>
</html>
